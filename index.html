<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Route Planning Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            color: #333;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
            margin: 5px 0 0 0;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .section {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52,152,219,0.3);
        }

        button {
            background: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-right: 8px;
            margin-bottom: 8px;
            transition: background 0.3s;
            width: 100%;
            margin-right: 0;
        }

        button:hover {
            background: #2980b9;
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }

        button.success {
            background: #27ae60;
        }

        button.success:hover {
            background: #229954;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .button-group button {
            flex: 1;
            margin: 0;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .item-list {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-list button {
            padding: 5px 10px;
            font-size: 12px;
            margin: 0;
            width: auto;
        }

        .stats {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        .stats p {
            margin: 5px 0;
        }

        #messages {
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            resize: vertical;
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Election Route Planning Tool</h1>
            <p>MPTC & ZPTC 2014 | Organize polling routes efficiently</p>
        </div>

        <div class="content">
            <div id="messages"></div>

            <!-- Map Setup Section -->
            <div class="section">
                <h2>📍 Map Setup</h2>
                <div class="form-group">
                    <label>Mandal/Zone Name:</label>
                    <input type="text" id="mandalName" placeholder="e.g., Lepakshi" value="Lepakshi">
                </div>
            </div>

            <!-- Route Configuration -->
            <div class="section">
                <h2>🛣️ Route Configuration</h2>
                <div class="form-group">
                    <label>Number of Routes:</label>
                    <input type="number" id="numRoutes" min="1" max="10" value="3">
                </div>
                <div class="form-group">
                    <label>Route Name Pattern:</label>
                    <input type="text" id="routeNamePattern" placeholder="e.g., Route-" value="Route-">
                </div>
                <div class="button-group">
                    <button class="success" onclick="createRoutes()">Create Routes</button>
                    <button class="danger" onclick="clearRoutes()">Clear Routes</button>
                </div>
                <div id="routesList"></div>
            </div>

            <!-- Polling Stations -->
            <div class="section">
                <h2>🏛️ Add Polling Station</h2>
                <div class="form-group">
                    <label>PS Name:</label>
                    <input type="text" id="psName" placeholder="e.g., School A">
                </div>
                <div class="form-group">
                    <label>Village Name:</label>
                    <input type="text" id="psVillage" placeholder="Village Name">
                </div>
                <div class="form-group">
                    <label>Latitude:</label>
                    <input type="number" id="psLat" placeholder="13.3521" step="0.0001">
                </div>
                <div class="form-group">
                    <label>Longitude:</label>
                    <input type="number" id="psLng" placeholder="79.3203" step="0.0001">
                </div>
                <button class="success" onclick="addPollingStation()" style="width: 100%;">Add Polling Station</button>
                <div id="pollingStationsList" style="margin-top: 12px;"></div>
            </div>

            <!-- Boundary Map Upload -->
            <div class="section">
                <h2>🗺️ Upload Boundary Map</h2>
                <div class="form-group">
                    <label>Select Boundary Map Image:</label>
                    <input type="file" id="boundaryMapFile" accept="image/*">
                </div>
                <button class="success" onclick="uploadBoundaryMap()" style="width: 100%;">Upload Map</button>
                <div id="mapStatus" style="margin-top: 10px;"></div>
            </div>

            <!-- Assign to Routes -->
            <div class="section">
                <h2>📌 Assign to Routes</h2>
                <div class="form-group">
                    <label>Select Polling Station:</label>
                    <select id="psSelect"></select>
                </div>
                <div class="form-group">
                    <label>Select Route:</label>
                    <select id="routeSelect"></select>
                </div>
                <div class="button-group">
                    <button class="success" onclick="assignPSToRoute()">Assign</button>
                    <button class="danger" onclick="unassignPS()">Unassign</button>
                </div>
                <div id="assignmentStats" style="margin-top: 12px;"></div>
            </div>

            <!-- Export & Download -->
            <div class="section">
                <h2>📥 Export & Download</h2>
                <button class="success" onclick="downloadRouteData()" style="width: 100%; margin-bottom: 8px;">📄 Download Routes (TXT)</button>
                <button onclick="exportAsJSON()" style="width: 100%; margin-bottom: 8px;">💾 Export as JSON</button>
                <button class="secondary" onclick="printData()" style="width: 100%;">🖨️ Print Data</button>
            </div>
        </div>
    </div>

    <script>
        let routes = [];
        let pollingStations = [];
        let boundaryMapData = null;

        function showMessage(message, type = 'success') {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            messageEl.textContent = message;
            messagesDiv.appendChild(messageEl);

            setTimeout(() => {
                messageEl.remove();
            }, 3000);
        }

        function createRoutes() {
            const numRoutes = parseInt(document.getElementById('numRoutes').value);
            const namePattern = document.getElementById('routeNamePattern').value;

            if (numRoutes < 1 || numRoutes > 10) {
                showMessage('Routes must be between 1 and 10', 'error');
                return;
            }

            routes = [];
            for (let i = 1; i <= numRoutes; i++) {
                routes.push({
                    id: i,
                    name: namePattern + i,
                    pollingStations: []
                });
            }

            updateRoutesList();
            updateRouteSelects();
            showMessage(`${numRoutes} routes created!`);
        }

        function clearRoutes() {
            if (confirm('Clear all routes?')) {
                routes = [];
                pollingStations.forEach(ps => ps.route = null);
                updateRoutesList();
                updatePollingStationsList();
                updateRouteSelects();
                updateAssignmentStats();
                showMessage('Routes cleared');
            }
        }

        function updateRoutesList() {
            const list = document.getElementById('routesList');
            list.innerHTML = '';

            if (routes.length === 0) {
                list.innerHTML = '<p style="color: #999; font-size: 12px;">No routes created yet</p>';
                return;
            }

            routes.forEach(route => {
                const item = document.createElement('div');
                item.className = 'item-list';
                item.innerHTML = `
                    <span>${route.name} (${route.pollingStations.length} stations)</span>
                    <button class="danger" onclick="deleteRoute(${route.id})">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        function deleteRoute(routeId) {
            if (confirm('Delete this route?')) {
                routes = routes.filter(r => r.id !== routeId);
                pollingStations.forEach(ps => {
                    if (ps.route === routeId) ps.route = null;
                });
                updateRoutesList();
                updateRouteSelects();
                updateAssignmentStats();
                showMessage('Route deleted');
            }
        }

        function addPollingStation() {
            const name = document.getElementById('psName').value.trim();
            const village = document.getElementById('psVillage').value.trim();
            const lat = parseFloat(document.getElementById('psLat').value);
            const lng = parseFloat(document.getElementById('psLng').value);

            if (!name || !village || isNaN(lat) || isNaN(lng)) {
                showMessage('Please fill all fields', 'error');
                return;
            }

            const ps = {
                id: Date.now(),
                name,
                village,
                lat,
                lng,
                route: null
            };

            pollingStations.push(ps);

            document.getElementById('psName').value = '';
            document.getElementById('psVillage').value = '';
            document.getElementById('psLat').value = '';
            document.getElementById('psLng').value = '';

            updatePollingStationsList();
            updatePSSelects();
            showMessage(`${name} added!`);
        }

        function updatePollingStationsList() {
            const list = document.getElementById('pollingStationsList');
            list.innerHTML = '';

            if (pollingStations.length === 0) {
                list.innerHTML = '<p style="color: #999; font-size: 12px;">No stations added</p>';
                return;
            }

            pollingStations.forEach(ps => {
                const routeName = ps.route ? routes.find(r => r.id === ps.route)?.name : 'Unassigned';
                const item = document.createElement('div');
                item.className = 'item-list';
                item.innerHTML = `
                    <div>
                        <strong>${ps.name}</strong><br>
                        <small style="color: #666;">${ps.village} | ${routeName}</small>
                    </div>
                    <button class="danger" onclick="deletePS(${ps.id})">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        function deletePS(psId) {
            if (confirm('Delete this station?')) {
                pollingStations = pollingStations.filter(ps => ps.id !== psId);
                updatePollingStationsList();
                updatePSSelects();
                updateAssignmentStats();
                showMessage('Station deleted');
            }
        }

        function uploadBoundaryMap() {
            const file = document.getElementById('boundaryMapFile').files[0];
            if (!file) {
                showMessage('Please select a file', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showMessage('File too large (max 5MB)', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                boundaryMapData = e.target.result;
                document.getElementById('mapStatus').innerHTML = `
                    <div class="message success">
                        ✓ Boundary map uploaded! (${file.name})
                    </div>
                `;
                showMessage('Map uploaded successfully!');
            };
            reader.readAsDataURL(file);
        }

        function updateRouteSelects() {
            const selects = document.querySelectorAll('select[id$="Select"]');
            selects.forEach(select => {
                if (select.id === 'routeSelect') {
                    select.innerHTML = '<option value="">Select Route</option>';
                    routes.forEach(route => {
                        select.innerHTML += `<option value="${route.id}">${route.name}</option>`;
                    });
                }
            });
        }

        function updatePSSelects() {
            const psSelect = document.getElementById('psSelect');
            psSelect.innerHTML = '<option value="">Select Polling Station</option>';
            pollingStations.forEach(ps => {
                psSelect.innerHTML += `<option value="${ps.id}">${ps.name} - ${ps.village}</option>`;
            });
        }

        function assignPSToRoute() {
            const psId = parseInt(document.getElementById('psSelect').value);
            const routeId = parseInt(document.getElementById('routeSelect').value);

            if (!psId || !routeId) {
                showMessage('Select both PS and route', 'error');
                return;
            }

            const ps = pollingStations.find(p => p.id === psId);
            const route = routes.find(r => r.id === routeId);

            if (ps.route === routeId) {
                showMessage('Already assigned to this route', 'error');
                return;
            }

            if (ps.route) {
                const oldRoute = routes.find(r => r.id === ps.route);
                if (oldRoute) {
                    oldRoute.pollingStations = oldRoute.pollingStations.filter(p => p.id !== psId);
                }
            }

            ps.route = routeId;
            route.pollingStations.push(ps);

            updatePollingStationsList();
            updateRoutesList();
            updateAssignmentStats();
            showMessage(`${ps.name} assigned to ${route.name}!`);
        }

        function unassignPS() {
            const psId = parseInt(document.getElementById('psSelect').value);

            if (!psId) {
                showMessage('Select a PS', 'error');
                return;
            }

            const ps = pollingStations.find(p => p.id === psId);

            if (ps && ps.route) {
                const route = routes.find(r => r.id === ps.route);
                if (route) {
                    route.pollingStations = route.pollingStations.filter(p => p.id !== psId);
                }
                ps.route = null;

                updatePollingStationsList();
                updateRoutesList();
                updateAssignmentStats();
                showMessage(`${ps.name} unassigned!`);
            }
        }

        function updateAssignmentStats() {
            const statsDiv = document.getElementById('assignmentStats');
            const total = pollingStations.length;
            const assigned = pollingStations.filter(ps => ps.route).length;

            if (total === 0) {
                statsDiv.innerHTML = '';
                return;
            }

            const percentage = ((assigned / total) * 100).toFixed(1);
            statsDiv.innerHTML = `
                <div class="stats">
                    <p><strong>Total Stations:</strong> ${total}</p>
                    <p><strong>Assigned:</strong> ${assigned}</p>
                    <p><strong>Unassigned:</strong> ${total - assigned}</p>
                    <p><strong>Coverage:</strong> ${percentage}%</p>
                </div>
            `;
        }

        function downloadRouteData() {
            let data = `ELECTION ROUTE PLANNING\n`;
            data += `Mandal: ${document.getElementById('mandalName').value}\n`;
            data += `Date: ${new Date().toLocaleString()}\n\n`;
            data += `${'='.repeat(50)}\n\n`;

            routes.forEach(route => {
                data += `${route.name}:\n`;
                data += `${'─'.repeat(40)}\n`;
                data += `Polling Stations: ${route.pollingStations.length}\n\n`;
                route.pollingStations.forEach((ps, idx) => {
                    data += `${idx + 1}. ${ps.name}\n`;
                    data += `   Village: ${ps.village}\n`;
                    data += `   Lat: ${ps.lat}, Lng: ${ps.lng}\n\n`;
                });
            });

            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(data));
