<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Route Planning Map Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 350px;
            background: white;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 20px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        #map {
            flex: 1;
            position: relative;
        }

        .section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section h3 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        button {
            background: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-right: 5px;
            margin-bottom: 8px;
            transition: background 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        button.secondary {
            background: #95a5a6;
        }

        button.secondary:hover {
            background: #7f8c8d;
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }

        button.success {
            background: #27ae60;
        }

        button.success:hover {
            background: #229954;
        }

        .route-item {
            background: #f9f9f9;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #3498db;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .route-item.route-1 { border-left-color: #e74c3c; }
        .route-item.route-2 { border-left-color: #27ae60; }
        .route-item.route-3 { border-left-color: #f39c12; }
        .route-item.route-4 { border-left-color: #9b59b6; }
        .route-item.route-5 { border-left-color: #1abc9c; }

        .route-item span {
            font-size: 12px;
            font-weight: 500;
        }

        .route-item button {
            padding: 5px 8px;
            margin: 0;
            font-size: 11px;
        }

        .polling-station-item {
            background: #f0f0f0;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 3px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .polling-station-item.assigned {
            background: #d5f4e6;
        }

        .stats {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .stats p {
            margin: 4px 0;
        }

        .stats strong {
            color: #2c3e50;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 40vh;
            }
            #map {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div id="messages"></div>

            <!-- Map Setup Section -->
            <div class="section">
                <h3>📍 Map Setup</h3>
                <label>Mandal/Zone Name:</label>
                <input type="text" id="mandalName" placeholder="Enter mandal name" value="Lepakshi">
                
                <label>Initial Latitude:</label>
                <input type="number" id="initLat" placeholder="13.3521" value="13.3521" step="0.0001">
                
                <label>Initial Longitude:</label>
                <input type="number" id="initLng" placeholder="79.3203" value="79.3203" step="0.0001">
                
                <button onclick="updateMapCenter()" class="success">Update Center</button>
            </div>

            <!-- Route Configuration -->
            <div class="section">
                <h3>🛣️ Route Configuration</h3>
                <label>Number of Routes:</label>
                <input type="number" id="numRoutes" min="1" max="10" value="3">
                
                <label>Route Name Pattern:</label>
                <input type="text" id="routeNamePattern" placeholder="e.g., Route-" value="Route-">
                
                <button onclick="createRoutes()" class="success" style="width: 48%; display: inline-block;">Create Routes</button>
                <button onclick="clearRoutes()" class="danger" style="width: 48%; display: inline-block; margin-left: 4%;">Clear Routes</button>

                <div id="routesList" style="margin-top: 10px;"></div>
            </div>

            <!-- Polling Station Management -->
            <div class="section">
                <h3>🏛️ Add Polling Station</h3>
                <label>PS Name:</label>
                <input type="text" id="psName" placeholder="e.g., School A">
                
                <label>Village Name:</label>
                <input type="text" id="psVillage" placeholder="Village Name">
                
                <label>Latitude:</label>
                <input type="number" id="psLat" placeholder="13.3521" step="0.0001">
                
                <label>Longitude:</label>
                <input type="number" id="psLng" placeholder="79.3203" step="0.0001">
                
                <button onclick="addPollingStation()" class="success" style="width: 100%;">Add Polling Station</button>

                <label style="margin-top: 15px; margin-bottom: 8px;"><strong>Polling Stations:</strong></label>
                <div id="pollingStationsList" style="max-height: 150px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 5px;"></div>
            </div>

            <!-- Assign to Routes -->
            <div class="section">
                <h3>📌 Assign to Routes</h3>
                <label>Select Polling Station:</label>
                <select id="psSelect"></select>
                
                <label>Select Route:</label>
                <select id="routeSelect"></select>
                
                <button onclick="assignPSToRoute()" class="success" style="width: 48%; display: inline-block;">Assign</button>
                <button onclick="unassignPS()" class="danger" style="width: 48%; display: inline-block; margin-left: 4%;">Unassign</button>

                <div id="assignmentStats" style="margin-top: 10px;"></div>
            </div>

            <!-- Export Options -->
            <div class="section">
                <h3>📥 Export & Download</h3>
                <button onclick="downloadMapImage()" class="success" style="width: 100%; margin-bottom: 8px;">📷 Download Map (PNG)</button>
                <button onclick="downloadRouteData()" class="secondary" style="width: 100%; margin-bottom: 8px;">📄 Download Route Data</button>
                <button onclick="exportAsJSON()" class="secondary" style="width: 100%; margin-bottom: 8px;">💾 Export as JSON</button>
                <button onclick="printMap()" class="secondary" style="width: 100%;">🖨️ Print Map</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>🗺️ Election Route Planning Tool</h1>
                <p>MPTC & ZPTC 2014 | Plan and organize polling station routes efficiently</p>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // Global Variables
        let map;
        let routes = [];
        let pollingStations = [];
        let markers = {};
        let routeColors = ['#e74c3c', '#27ae60', '#f39c12', '#9b59b6', '#1abc9c', '#16a085', '#2980b9', '#8e44ad', '#c0392b', '#d35400'];

        // Initialize Map
        function initMap() {
            const lat = parseFloat(document.getElementById('initLat').value) || 13.3521;
            const lng = parseFloat(document.getElementById('initLng').value) || 79.3203;
            
            map = L.map('map').setView([lat, lng], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            // Add scale
            L.control.scale().addTo(map);
        }

        // Update Map Center
        function updateMapCenter() {
            const lat = parseFloat(document.getElementById('initLat').value);
            const lng = parseFloat(document.getElementById('initLng').value);
            
            if (!isNaN(lat) && !isNaN(lng)) {
                map.setView([lat, lng], 12);
                showMessage('Map center updated!');
            } else {
                showMessage('Please enter valid coordinates', 'error');
            }
        }

        // Show Messages
        function showMessage(message, type = 'success') {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = type === 'success' ? 'success-message' : 'error-message';
            messageEl.textContent = message;
            messagesDiv.appendChild(messageEl);

            setTimeout(() => {
                messageEl.remove();
            }, 3000);
        }

        // Create Routes
        function createRoutes() {
            const numRoutes = parseInt(document.getElementById('numRoutes').value);
            const namePattern = document.getElementById('routeNamePattern').value;

            if (numRoutes < 1 || numRoutes > 10) {
                showMessage('Routes must be between 1 and 10', 'error');
                return;
            }

            routes = [];
            for (let i = 1; i <= numRoutes; i++) {
                routes.push({
                    id: i,
                    name: namePattern + i,
                    color: routeColors[i - 1] || '#95a5a6',
                    pollingStations: []
                });
            }

            updateRoutesList();
            updateRouteSelects();
            showMessage(`${numRoutes} routes created successfully!`);
        }

        // Clear Routes
        function clearRoutes() {
            if (confirm('Are you sure? This will clear all routes and station assignments.')) {
                routes = [];
                pollingStations.forEach(ps => ps.route = null);
                updateRoutesList();
                updatePollingStationsList();
                updateRouteSelects();
                updateAssignmentStats();
                pollingStations.forEach(ps => {
                    if (markers[ps.id]) {
                        markers[ps.id].setStyle({ fillColor: '#3498db' });
                    }
                });
                showMessage('All routes cleared');
            }
        }

        // Update Routes List Display
        function updateRoutesList() {
            const list = document.getElementById('routesList');
            list.innerHTML = '';

            if (routes.length === 0) {
                list.innerHTML = '<p style="color: #999; font-size: 12px;">No routes created yet</p>';
                return;
            }

            routes.forEach(route => {
                const item = document.createElement('div');
                item.className = `route-item route-${route.id}`;
                item.style.borderLeftColor = route.color;
                item.innerHTML = `
                    <span>${route.name} (${route.pollingStations.length} PS)</span>
                    <button class="danger" onclick="deleteRoute(${route.id})" style="padding: 3px 6px; font-size: 11px;">×</button>
                `;
                list.appendChild(item);
            });
        }

        // Delete Route
        function deleteRoute(routeId) {
            if (confirm('Delete this route?')) {
                routes = routes.filter(r => r.id !== routeId);
                pollingStations.forEach(ps => {
                    if (ps.route === routeId) {
                        ps.route = null;
                        if (markers[ps.id]) markers[ps.id].setStyle({ fillColor: '#3498db' });
                    }
                });
                updateRoutesList();
                updateRouteSelects();
                updateAssignmentStats();
                showMessage('Route deleted');
            }
        }

        // Add Polling Station
        function addPollingStation() {
            const name = document.getElementById('psName').value.trim();
            const village = document.getElementById('psVillage').value.trim();
            const lat = parseFloat(document.getElementById('psLat').value);
            const lng = parseFloat(document.getElementById('psLng').value);

            if (!name || !village || isNaN(lat) || isNaN(lng)) {
                showMessage('Please fill all fields correctly', 'error');
                return;
            }

            const ps = {
                id: Date.now(),
                name,
                village,
                lat,
                lng,
                route: null
            };

            pollingStations.push(ps);

            // Add marker on map
            const marker = L.circleMarker([lat, lng], {
                radius: 8,
                fillColor: '#3498db',
                color: '#2c3e50',
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0.7
            }).addTo(map).bindPopup(`<strong>${name}</strong><br>${village}`);

            markers[ps.id] = marker;

            // Clear inputs
            document.getElementById('psName').value = '';
            document.getElementById('psVillage').value = '';
            document.getElementById('psLat').value = '';
            document.getElementById('psLng').value = '';

            updatePollingStationsList();
            updatePSSelects();
            updateAssignmentStats();
            showMessage(`Polling station '${name}' added`);
        }

        // Update Polling Stations List
        function updatePollingStationsList() {
            const list = document.getElementById('pollingStationsList');
            list.innerHTML = '';

            if (pollingStations.length === 0) {
                list.innerHTML = '<p style="color: #999; font-size: 12px; padding: 5px;">No polling stations added</p>';
                return;
            }

            pollingStations.forEach(ps => {
                const item = document.createElement('div');
                item.className = `polling-station-item ${ps.route ? 'assigned' : ''}`;
                const routeName = ps.route ? routes.find(r => r.id === ps.route)?.name : 'Unassigned';
                item.innerHTML = `
                    <div style="flex: 1;">
                        <strong style="font-size: 12px;">${ps.name}</strong><br>
                        <span style="font-size: 11px; color: #666;">${ps.village} | ${routeName}</span>
                    </div>
                    <button class="danger" style="padding: 3px 6px; font-size: 11px; margin: 0;" onclick="deletePS(${ps.id})">×</button>
                `;
                list.appendChild(item);
            });
        }

        // Delete Polling Station
        function deletePS(psId) {
            if (confirm('Delete this polling station?')) {
                pollingStations = pollingStations.filter(ps => ps.id !== psId);
                if (markers[psId]) markers[psId].remove();
                delete markers[psId];
                updatePollingStationsList();
                updatePSSelects();
                updateAssignmentStats();
                showMessage('Polling station deleted');
            }
        }

        // Update Route Selects
        function updateRouteSelects() {
            const selects = document.querySelectorAll('select[id$="Route"]');
            selects.forEach(select => {
                select.innerHTML = '<option value="">Select Route</option>';
                routes.forEach(route => {
                    select.innerHTML += `<option value="${route.id}">${route.name}</option>`;
                });
            });
        }

        // Update PS Selects
        function updatePSSelects() {
            const psSelect = document.getElementById('psSelect');
            psSelect.innerHTML = '<option value="">Select Polling Station</option>';
            pollingStations.forEach(ps => {
                psSelect.innerHTML += `<option value="${ps.id}">${ps.name} (${ps.village})</option>`;
            });
        }

        // Assign PS to Route
        function assignPSToRoute() {
            const psId = parseInt(document.getElementById('psSelect').value);
            const route
